# Put the map block in nginx's http {} context, not inside server {}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name oj.example.com;
    client_max_body_size 64m;

    root /srv/nywOJ/web/dist;
    index index.html;

    # Online IDE interactive terminal. Without these Upgrade headers,
    # /api/ide/stream will fail even when normal REST APIs work.
    location /api/ide/stream {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_buffering off;
    }

    # Server-Sent Events for submission progress and AI generation progress.
    location ~ ^/api/(judge/streamSubmission|contest/streamSubmission|problem/ai/generationStream) {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_buffering off;
        gzip off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
