[package]
name = "sandbox-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Teaching Linux sandbox engine: namespaces, cgroups v2, seccomp, rlimits, pivot_root"

[dependencies]
nix = { version = "0.29", features = [
    "sched",
    "mount",
    "process",
    "signal",
    "fs",
    "user",
    "resource",
    "ptrace",
    "hostname",
] }
libc = "0.2"
seccompiler = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[[example]]
name = "cli"
path = "examples/cli.rs"
